name: Linux package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install desktop keyring test dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11
      - run: npm ci --ignore-scripts
      - name: Test and package with isolated Secret Service
        run: dbus-run-session -- bash scripts/linux-ci.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OmniRoute-Regular-linux-x64
          path: |
            release/*.tar.gz
            release/*.sha256
          if-no-files-found: error
